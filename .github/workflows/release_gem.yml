on:
  workflow_dispatch:

jobs:
  release:
    if: github.repository == 'unasuke/quic-ruby'
    runs-on: ubuntu-latest

    environment:
      name: rubygems.org
      url: https://rubygems.org/gems/quic

    permissions:
      contents: write
      id-token: write

    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: ruby

      # Deliberately without bundler-cache, which installs into ./vendor/bundle and
      # writes BUNDLE_PATH into .bundle/config. rake-compiler-dock mounts the working
      # dir into a container with an older glibc, and a local .bundle/config outranks
      # the BUNDLE_PATH environment variable, so the container's bundler would load
      # the host-built native gems from vendor/bundle and die with "GLIBC_x.yz not
      # found". BUNDLE_FROZEN keeps this install from rewriting Gemfile.lock, which
      # would trip release:guard_clean further down.
      - name: Install host gems
        run: BUNDLE_FROZEN=true bundle install

      # Build the precompiled x86_64-linux-gnu gem first, so a broken build stops
      # the job before release-gem creates the tag. pkg/ is gitignored, so it does
      # not disturb release:guard_clean inside the rake release run below.
      - name: Build precompiled x86_64-linux-gnu gem
        run: bundle exec rake gem:x86_64-linux-gnu

      # release-gem awaits every pkg/*.gem, so the not-yet-pushed precompiled gem
      # has to be moved out of pkg/ first. RUNNER_TEMP is outside the repository,
      # so it stays invisible to release:guard_clean.
      - name: Move precompiled gem out of pkg/
        run: |
          mkdir -p "${RUNNER_TEMP}/precompiled"
          mv pkg/quic-*-x86_64-linux-gnu.gem "${RUNNER_TEMP}/precompiled/"

      # Makes the build: :compile dependency of rake release a no-op. Trusted
      # publishing API keys expire 15 minutes after they are issued, so the full
      # LibreSSL/ngtcp2 build must not run inside release-gem.
      - name: Compile extension on host
        run: bundle exec rake compile

      # Tags from lib/quic/version.rb, pushes the source (ruby platform) gem.
      - uses: rubygems/release-gem@7f9650160c1a4e7989fdc9855807bdbd421d8b6b # v1.4.1

      # rubygems/configure-rubygems-credentials has no post step, so the trusted
      # publishing credentials configured by release-gem last until the job ends.
      - name: Push precompiled x86_64-linux-gnu gem
        run: gem push "${RUNNER_TEMP}"/precompiled/quic-*-x86_64-linux-gnu.gem

      - name: Create GitHub release
        run: |
          tag_name="$(git describe --tags --abbrev=0)"
          gh release create "${tag_name}" --verify-tag --generate-notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
